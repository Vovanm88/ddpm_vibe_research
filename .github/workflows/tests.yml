name: tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv sync --locked --extra dev --extra interactive
      - run: uv run ruff check src tests examples scripts
      - run: uv run pytest -q
        env:
          MPLBACKEND: Agg
