seed: 42
device: cpu
num_threads: 4
environment:
  name: n_moons
  n_samples: 4096
  n_classes: 5
  noise: 0.05
model:
  backbone: mlp
  hidden_dim: 128
  num_layers: 4
  conditioner: embedding
scheduler:
  kind: ddpm
  num_train_timesteps: 1000
  beta_schedule: squaredcos_cap_v2
  prediction_type: epsilon
training:
  epochs: 200
  batch_size: 256
  learning_rate: 0.001
  condition_dropout: 0.15
  ema_decay: 0.99
  loss: mse
  objective: diffusion
sampling:
  scheduler: ddim
  steps: 100
  num_samples: 1024
  guidance_scale: 1.5
