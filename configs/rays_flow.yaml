seed: 42
device: cpu
num_threads: 4
environment:
  name: rotating_rays
  n_samples: 4096
  n_classes: 4
model:
  hidden_dim: 128
  num_layers: 4
  conditioner: embedding
scheduler:
  kind: flow
  num_train_timesteps: 1000
training:
  epochs: 200
  batch_size: 256
  learning_rate: 0.001
  condition_dropout: 0.15
  ema_decay: 0.99
  objective: rectified_flow
  loss: huber
sampling:
  scheduler: flow
  steps: 100
  num_samples: 1024
  guidance_scale: 1.5
