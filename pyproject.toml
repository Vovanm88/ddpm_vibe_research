[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-lab"
version = "0.4.5"
description = "Small, extensible diffusion and flow-matching experiments on points and paths"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4,<3", "diffusers>=0.35,<0.40", "numpy>=1.26,<3",
  "scipy>=1.11,<2", "matplotlib>=3.8,<4", "PyYAML>=6,<7", "pillow>=10",
]

[project.optional-dependencies]
replication = ["geomloss>=0.3.1,<0.4"]
mnist = ["torchvision>=0.29,<0.30"]
interactive = ["plotly>=5.24,<7", "ipywidgets>=8", "ipykernel>=6"]
dev = ["pytest>=8,<10", "ruff>=0.9", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]

[project.scripts]
diffusion-lab = "diffusion_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
